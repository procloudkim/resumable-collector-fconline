name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: 공개 트리 검사
        # 자격 증명, 개인 경로, 제3자 개인정보가 남아 있는지 확인한다.
        # 다른 검사보다 먼저 돌린다. 유출은 실패보다 되돌리기 어렵다.
        #
        # 이 저장소에서는 특히 댓글 작성자 핸들 규칙이 중요하다. 데이터 파일을
        # 전부 제외했는데도 문서 한 건으로 새고 있었던 전례가 있다.
        run: python scripts/check_public_tree.py

      - name: 수집 데이터 부재 확인
        # 공개본에 데이터가 다시 들어오면 실패시킨다. 설정 예시는 예외다.
        run: |
          found=$(find . -path ./.git -prune -o -type f \
            \( -name '*.db' -o -name '*.sqlite*' -o -name '*.parquet' -o -name '*.zip' \) -print)
          if [ -n "$found" ]; then
            echo "데이터 파일이 저장소에 있다:"; echo "$found"; exit 1
          fi
          csv=$(find . -path ./.git -prune -o -type f -name '*.csv' ! -name '*.sample.csv' -print)
          if [ -n "$csv" ]; then
            echo "샘플이 아닌 CSV 가 있다:"; echo "$csv"; exit 1
          fi
          echo "ok  수집 데이터 없음"

      - name: 의존성 설치
        run: pip install -r requirements.txt

      - name: 테스트
        run: pytest -q
